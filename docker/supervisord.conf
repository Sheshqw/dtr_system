[supervisord]
nodaemon=true
user=root
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[program:php-fpm]
command=/usr/local/sbin/php-fpm -F -R
autostart=true
autorestart=true
priority=5
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=10
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Reverb websocket server — only reachable through nginx's /app and /apps
; proxy (docker/nginx.conf), never directly from outside.
[program:reverb]
command=/usr/local/bin/php /var/www/html/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=12
stopwaitsecs=10
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Queue worker — with QUEUE_CONNECTION=database queued jobs would otherwise
; sit in the jobs table forever. Restarts hourly to stay fresh.
[program:queue]
command=/usr/local/bin/php /var/www/html/artisan queue:work --sleep=3 --tries=3 --backoff=30 --max-time=3600
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=15
stopwaitsecs=60
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; Laravel's scheduler (routes/console.php — the 2:00 AM auto-backup), so no
; outside cron is needed.
[program:scheduler]
command=/usr/local/bin/php /var/www/html/artisan schedule:work
directory=/var/www/html
user=www-data
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/null
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

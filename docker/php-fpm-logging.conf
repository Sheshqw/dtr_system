; Keep what PHP workers write to stderr (Laravel's error log) so it shows up
; in Railway → Deploy Logs, not just nginx/FPM status lines.
[www]
catch_workers_output = yes
decorate_workers_output = no

; The stock pool caps out at 5 PHP workers, so a handful of slow requests
; (a PDF export, a big report) made every other visitor queue behind them.
; Idle workers are reaped, so this costs memory only while busy.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

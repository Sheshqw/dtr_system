user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log/nginx/access.log;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # This config replaces Alpine's stock nginx.conf, so its default temp
    # paths no longer exist — point them at directories the Dockerfile
    # creates, or any request body over the in-memory buffer fails with a 500.
    client_body_temp_path /tmp/nginx-client-body;
    client_body_buffer_size 256k;
    fastcgi_temp_path /tmp/nginx-fastcgi;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml image/svg+xml;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        # start.sh rewrites this to Railway's $PORT
        listen 8000;
        root /var/www/html/public;
        index index.php index.html;

        # Health check — handled by nginx directly, no PHP needed
        location = /health {
            access_log off;
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # Reverb (live attendance / print-consent updates). Railway exposes
        # only one port, so the websocket server runs inside this container
        # on 8080 and nginx forwards the Pusher-protocol paths to it.
        location ~ ^/(app|apps)/ {
            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_read_timeout 120s;
        }

        # Laravel front-controller
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        # PHP-FPM
        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_read_timeout 120;
            include fastcgi_params;
        }

        # Block hidden files
        location ~ /\.ht {
            deny all;
        }

        # Long-lived cache for compiled assets
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
